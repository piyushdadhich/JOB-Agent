[pytest]
# The project's tests live under tests/. The vendor/ tree holds
# third-party source clones (theHarvester) whose own tests pull in
# 25+ heavy deps we don't install. Restrict pytest collection so a
# bare `pytest` run only walks the project's tests.
testpaths = tests
norecursedirs =
    vendor
    venv
    venv-skills
    node_modules
    dashboard/frontend
    .pytest_cache

# pytest-asyncio: 'auto' makes any async-def test pickup-as-async
# without requiring the @pytest.mark.asyncio decorator. The codebase
# has a mix of decorated + bare async tests; auto handles both.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
